openapi: 3.1.0
info:
  title: PetWise Backend API
  version: 1.0.0
  description: >
    Production-oriented OpenAPI specification for the PetWise backend.
    The API serves a definition-driven questionnaire flow, deterministic breed
    matching, persisted match results, breed details, and operational health
    endpoints.
servers:
  - url: https://petwise-api.65-109-135-215.sslip.io
    description: Live Hetzner environment
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: health
    description: Operational liveness and readiness checks
  - name: questionnaire
    description: Questionnaire definition and profile-building endpoints
  - name: matching
    description: Breed ranking and persisted match results
  - name: breeds
    description: Breed catalog and breed detail payloads
paths:
  /health:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: getHealth
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                service: petwise-backend
                environment: production
                uptimeSeconds: 9482
  /ready:
    get:
      tags: [health]
      summary: Readiness probe
      operationId: getReadiness
      responses:
        '200':
          description: Service is ready to serve traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                status: ready
                service: petwise-backend
                environment: production
                questionnaireVersion: 1
                scoringVersion: 2
  /questionnaire/definition:
    get:
      tags: [questionnaire]
      summary: Get active questionnaire definition
      operationId: getQuestionnaireDefinition
      responses:
        '200':
          description: Active questionnaire definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionnaireDefinitionResponse'
              example:
                questionnaireVersion: 1
                questions:
                  - id: pet_type
                    order: 1
                    kind: single_choice
                    required: true
                    title: Какой питомец вас интересует?
                    description: null
                    maxSelections: null
                    options:
                      - id: dog
                        label: Собака
                      - id: cat
                        label: Кошка
                      - id: unknown
                        label: Пока не знаю
  /questionnaire/profile:
    post:
      tags: [questionnaire]
      summary: Build a user profile from questionnaire answers
      operationId: buildUserProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildProfileRequest'
            example:
              questionnaireVersion: 1
              answers:
                - questionId: pet_type
                  selectedOptionIds: [dog]
                - questionId: home_type
                  selectedOptionIds: [apartment]
                - questionId: priorities
                  selectedOptionIds: [quiet, apartment_friendly]
      responses:
        '200':
          description: Built user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
              example:
                questionnaireVersion: 1
                userProfile:
                  petType: dog
                  sizePreference: [2, 3]
                  exerciseNeeds: 2
                  apartmentSuitability: 5
                  aloneTolerance: 3
                  groomingNeeds: 1
                  sheddingLevel: 2
                  beginnerFriendly: 5
                  maintenanceCost: 2
                  noiseLevel: 1
                  priorities: [quiet, apartment_friendly]
                  criticalContext:
                    livesInApartment: true
                    hasYoungChildren: false
                    hasOtherPets: false
        '400':
          description: Invalid questionnaire payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Invalid questionnaire answers
                details:
                  - Question priorities exceeds maxSelections=3
                requestId: "1717498654123456"
        '500':
          description: Unexpected server-side failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /match/preview:
    post:
      tags: [matching]
      summary: Rank breeds and build the result payload
      operationId: previewMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchPreviewRequest'
            example:
              questionnaireVersion: 1
              userProfile:
                petType: dog
                sizePreference: [2, 3]
                exerciseNeeds: 2
                apartmentSuitability: 5
                aloneTolerance: 3
                groomingNeeds: 1
                sheddingLevel: 2
                beginnerFriendly: 5
                maintenanceCost: 2
                noiseLevel: 1
                priorities: [quiet, apartment_friendly]
                criticalContext:
                  livesInApartment: true
                  hasYoungChildren: false
                  hasOtherPets: false
      responses:
        '200':
          description: Match preview result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResult'
              examples:
                matchFound:
                  summary: Standard successful match response
                  value:
                    resultId: match_1840fd2d9c1_4c1fa1e4721b33f1
                    storedAt: '2026-06-04T10:15:30.000Z'
                    questionnaireVersion: 1
                    scoringVersion: 2
                    userProfile:
                      petType: dog
                      sizePreference: [2, 3]
                      exerciseNeeds: 2
                      apartmentSuitability: 5
                      aloneTolerance: 3
                      priorities: [quiet, apartment_friendly]
                    topMatch:
                      breedId: whippet
                      name: Whippet
                      matchPercent: 91
                      label: Идеальное совпадение
                      summary: Спокойная дома, хорошо подходит для квартиры и не требует сложного ухода.
                      warning: Может тяжелее переносить долгую разлуку.
                      strongMatches:
                        - Подходит для квартирной жизни
                        - Низкий уровень шума
                      weakMatches:
                        - Одиночество лучше ограничивать
                    alternatives:
                      - breedId: italian_greyhound
                        name: Italian Greyhound
                        matchPercent: 89
                    compatibility:
                      status: ready
                      breed_id: whippet
                      breed_name: Whippet
                      image_url: https://example.com/whippet.jpg
                      risk_level: low
                      score: 91
                      summary: Спокойная дома, хорошо подходит для квартиры и не требует сложного ухода.
                      compatible: true
                      insights:
                        - Подходит для квартирной жизни
                        - Низкий уровень шума
                      requirement_highlights:
                        - Одиночество лучше ограничивать
                      hard_reasons: []
                      risks:
                        - code: match_warning
                          severity: risk
                          message: Может тяжелее переносить долгую разлуку.
                      refusal: null
                      suggestions:
                        - breed_id: italian_greyhound
                          breed_name: Italian Greyhound
                          risk_level: medium
                          score: 89
                          summary: Компактная, нежная и спокойная порода-компаньон.
                          image_url: https://example.com/italian_greyhound.jpg
                noBreedsForPetType:
                  summary: No catalog entries for the requested pet type
                  value:
                    resultId: match_1840fd2d9c1_4c1fa1e4721b33f1
                    storedAt: '2026-06-04T10:15:30.000Z'
                    questionnaireVersion: 1
                    scoringVersion: 2
                    userProfile:
                      petType: cat
                    topMatch: null
                    alternatives: []
                    compatibility:
                      status: ready
                      breed_id: null
                      breed_name: null
                      image_url: null
                      risk_level: high
                      score: null
                      summary: No breeds available for the selected pet type.
                      compatible: false
                      insights: []
                      requirement_highlights: []
                      hard_reasons:
                        - code: no_breeds_for_pet_type
                          severity: hard
                          message: No breeds available for the selected pet type.
                      risks: []
                      refusal:
                        title: null
                        external_message: No breeds available for the selected pet type.
                      suggestions: []
                    refusal:
                      code: no_breeds_for_pet_type
                      message: No breeds available for the selected pet type.
                      title: null
                      externalMessage: No breeds available for the selected pet type.
        '400':
          description: Invalid match preview payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Invalid match preview request
                details:
                  - userProfile.priorities must be a list of strings
                requestId: "1717498654123457"
        '500':
          description: Unexpected server-side failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /matches/{resultId}:
    get:
      tags: [matching]
      summary: Get a persisted match result by id
      operationId: getMatchResultById
      parameters:
        - in: path
          name: resultId
          required: true
          description: Persisted match result identifier
          schema:
            type: string
      responses:
        '200':
          description: Persisted match result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResult'
        '404':
          description: Match result not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
              example:
                error: Match result not found
                resultId: match_unknown
        '500':
          description: Unexpected server-side failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /breeds/{breedId}:
    get:
      tags: [breeds]
      summary: Get breed details
      operationId: getBreedById
      parameters:
        - in: path
          name: breedId
          required: true
          description: Canonical PetWise breed identifier
          schema:
            type: string
      responses:
        '200':
          description: Breed details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Breed'
        '404':
          description: Breed not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
              example:
                error: Breed not found
                breedId: unknown_breed
        '500':
          description: Unexpected server-side failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /media/story-avatars/{fileName}:
    get:
      tags: [breeds]
      summary: Get story avatar image
      operationId: getStoryAvatar
      parameters:
        - in: path
          name: fileName
          required: true
          description: Story avatar file name
          schema:
            type: string
          example: whippet.webp
      responses:
        '200':
          description: Static WebP story avatar
          content:
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          description: Media not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
        - environment
        - uptimeSeconds
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: petwise-backend
        environment:
          type: string
          example: production
        uptimeSeconds:
          type: integer
          minimum: 0
    ReadinessResponse:
      type: object
      required:
        - status
        - service
        - environment
        - questionnaireVersion
        - scoringVersion
      properties:
        status:
          type: string
          enum: [ready]
        service:
          type: string
          example: petwise-backend
        environment:
          type: string
          example: production
        questionnaireVersion:
          type: integer
          minimum: 1
        scoringVersion:
          type: integer
          minimum: 1
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        details:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          nullable: true
        requestId:
          type: string
          nullable: true
        path:
          type: string
          nullable: true
        breedId:
          type: string
          nullable: true
        resultId:
          type: string
          nullable: true
    NotFoundErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
    QuestionnaireDefinitionResponse:
      type: object
      required:
        - questionnaireVersion
        - questions
      properties:
        questionnaireVersion:
          type: integer
          minimum: 1
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionDefinition'
    QuestionDefinition:
      type: object
      required:
        - id
        - order
        - kind
        - required
        - title
        - options
      properties:
        id:
          type: string
        order:
          type: integer
          minimum: 1
        kind:
          type: string
          enum: [single_choice, multi_choice]
        required:
          type: boolean
        title:
          type: string
        description:
          type: string
          nullable: true
        maxSelections:
          type: integer
          minimum: 1
          nullable: true
        options:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/QuestionOption'
    QuestionOption:
      type: object
      required:
        - id
        - label
      properties:
        id:
          type: string
        label:
          type: string
    BuildProfileRequest:
      type: object
      required:
        - questionnaireVersion
        - answers
      properties:
        questionnaireVersion:
          type: integer
          minimum: 1
        answers:
          type: array
          items:
            $ref: '#/components/schemas/QuestionAnswer'
    QuestionAnswer:
      type: object
      required:
        - questionId
        - selectedOptionIds
      properties:
        questionId:
          type: string
        selectedOptionIds:
          type: array
          items:
            type: string
    UserProfileResponse:
      type: object
      required:
        - questionnaireVersion
        - userProfile
      properties:
        questionnaireVersion:
          type: integer
          minimum: 1
        userProfile:
          $ref: '#/components/schemas/UserProfile'
    MatchPreviewRequest:
      type: object
      required:
        - questionnaireVersion
        - userProfile
      properties:
        questionnaireVersion:
          type: integer
          minimum: 1
        userProfile:
          $ref: '#/components/schemas/UserProfile'
    UserProfile:
      type: object
      properties:
        petType:
          type: string
          enum: [dog, cat]
        sizePreference:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 5
        exerciseNeeds:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        apartmentSuitability:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        aloneTolerance:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        goodWithChildren:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        goodWithOtherPets:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        groomingNeeds:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        sheddingLevel:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        beginnerFriendly:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        maintenanceCost:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        noiseLevel:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        trainability:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        temperamentCalm:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        priorities:
          type: array
          items:
            type: string
        criticalContext:
          $ref: '#/components/schemas/CriticalContext'
        profileDiagnostics:
          $ref: '#/components/schemas/ProfileDiagnostics'
    CriticalContext:
      type: object
      properties:
        hasYoungChildren:
          type: boolean
        hasOtherPets:
          type: boolean
        livesInApartment:
          type: boolean
    ProfileDiagnostics:
      type: object
      required:
        - hasConflicts
        - conflicts
      properties:
        hasConflicts:
          type: boolean
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ProfileConflict'
    ProfileConflict:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
        existingValue:
          nullable: true
        incomingValue:
          nullable: true
        resolvedValue:
          nullable: true
    Breed:
      type: object
      required:
        - breedId
        - petType
        - name
        - attributes
        - flags
        - content
        - quality
      properties:
        breedId:
          type: string
        petType:
          type: string
          enum: [dog, cat]
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
        group:
          type: string
          nullable: true
        imageUrl:
          type: string
          format: uri
          nullable: true
        storyAvatarUrl:
          type: string
          format: uri
          nullable: true
        galleryImages:
          type: array
          items:
            type: string
            format: uri
        attributes:
          $ref: '#/components/schemas/BreedAttributes'
        flags:
          $ref: '#/components/schemas/BreedFlags'
        content:
          $ref: '#/components/schemas/BreedContent'
        quality:
          $ref: '#/components/schemas/BreedQuality'
    BreedAttributes:
      type: object
      properties:
        size:
          type: integer
          minimum: 1
          maximum: 5
        apartmentSuitability:
          type: integer
          minimum: 1
          maximum: 5
        exerciseNeeds:
          type: integer
          minimum: 1
          maximum: 5
        aloneTolerance:
          type: integer
          minimum: 1
          maximum: 5
        goodWithChildren:
          type: integer
          minimum: 1
          maximum: 5
        goodWithOtherPets:
          type: integer
          minimum: 1
          maximum: 5
        groomingNeeds:
          type: integer
          minimum: 1
          maximum: 5
        sheddingLevel:
          type: integer
          minimum: 1
          maximum: 5
        beginnerFriendly:
          type: integer
          minimum: 1
          maximum: 5
        maintenanceCost:
          type: integer
          minimum: 1
          maximum: 5
        noiseLevel:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        trainability:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        temperamentCalm:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
    BreedFlags:
      type: object
      properties:
        isVocal:
          type: boolean
        isHighPreyDrive:
          type: boolean
        isSensitive:
          type: boolean
        isEscapeProne:
          type: boolean
        isSuitableForFirstTimeOwners:
          type: boolean
    BreedContent:
      type: object
      properties:
        summaryShort:
          type: string
        strengths:
          type: array
          items:
            type: string
        watchouts:
          type: array
          items:
            type: string
        adaptationTips:
          type: array
          items:
            type: string
    BreedQuality:
      type: object
      properties:
        confidenceScore:
          type: number
          format: float
        sourceCount:
          type: integer
        sourceNotes:
          type: array
          items:
            type: string
        needsReview:
          type: boolean
        version:
          type: integer
    MatchResult:
      type: object
      required:
        - resultId
        - storedAt
        - questionnaireVersion
        - scoringVersion
        - userProfile
        - topMatch
        - alternatives
        - compatibility
      properties:
        resultId:
          type: string
        storedAt:
          type: string
          format: date-time
        questionnaireVersion:
          type: integer
          minimum: 1
        scoringVersion:
          type: integer
          minimum: 1
        userProfile:
          $ref: '#/components/schemas/UserProfile'
        topMatch:
          allOf:
            - $ref: '#/components/schemas/RankedBreed'
          nullable: true
        alternatives:
          type: array
          items:
            $ref: '#/components/schemas/AlternativeBreed'
        compatibility:
          $ref: '#/components/schemas/CompatibilityView'
        refusal:
          $ref: '#/components/schemas/MatchRefusal'
    RankedBreed:
      type: object
      required:
        - breedId
        - name
        - matchPercent
        - label
        - summary
        - strongMatches
        - weakMatches
      properties:
        breedId:
          type: string
        name:
          type: string
        matchPercent:
          type: integer
          minimum: 0
          maximum: 96
        label:
          type: string
        summary:
          type: string
        warning:
          type: string
          nullable: true
        strongMatches:
          type: array
          items:
            type: string
        weakMatches:
          type: array
          items:
            type: string
    AlternativeBreed:
      type: object
      required:
        - breedId
        - name
        - matchPercent
      properties:
        breedId:
          type: string
        name:
          type: string
        matchPercent:
          type: integer
          minimum: 0
          maximum: 96
    MatchRefusal:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        title:
          type: string
          nullable: true
        externalMessage:
          type: string
          nullable: true
    CompatibilityView:
      type: object
      required:
        - status
        - insights
        - requirement_highlights
        - hard_reasons
        - risks
        - suggestions
      properties:
        status:
          type: string
        breed_id:
          type: string
          nullable: true
        breed_name:
          type: string
          nullable: true
        image_url:
          type: string
          format: uri
          nullable: true
        story_avatar_url:
          type: string
          format: uri
          nullable: true
        risk_level:
          type: string
          enum: [low, medium, high]
          nullable: true
        score:
          type: integer
          minimum: 0
          maximum: 96
          nullable: true
        summary:
          type: string
          nullable: true
        compatible:
          type: boolean
          nullable: true
        insights:
          type: array
          items:
            type: string
        requirement_highlights:
          type: array
          items:
            type: string
        hard_reasons:
          type: array
          items:
            $ref: '#/components/schemas/CompatibilityReason'
        risks:
          type: array
          items:
            $ref: '#/components/schemas/CompatibilityReason'
        refusal:
          $ref: '#/components/schemas/CompatibilityRefusal'
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/CompatibilitySuggestion'
    CompatibilityReason:
      type: object
      required:
        - code
        - severity
        - message
      properties:
        code:
          type: string
        severity:
          type: string
          enum: [hard, risk]
        message:
          type: string
    CompatibilityRefusal:
      type: object
      properties:
        title:
          type: string
          nullable: true
        external_message:
          type: string
          nullable: true
    CompatibilitySuggestion:
      type: object
      required:
        - breed_id
        - breed_name
      properties:
        breed_id:
          type: string
        breed_name:
          type: string
        risk_level:
          type: string
          enum: [low, medium, high]
          nullable: true
        score:
          type: integer
          minimum: 0
          maximum: 96
          nullable: true
        summary:
          type: string
          nullable: true
        image_url:
          type: string
          format: uri
          nullable: true
        story_avatar_url:
          type: string
          format: uri
          nullable: true
