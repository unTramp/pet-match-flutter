name: pet_match
description: "Pet Match — Android-first Flutter app for breed-matching questionnaire."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  get_it: ^8.0.2
  go_router: ^14.6.0
  logger: ^2.4.0
  shared_preferences: ^2.3.3
  uuid: ^4.5.1

dev_dependencies:
  bloc_test: ^10.0.0
  fake_async: ^1.3.1
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/mock/
